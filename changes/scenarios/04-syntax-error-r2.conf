
!
frr defaults traditional
hostname r2
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
 ip ospf passive
exit
!
interface to-r1
 ip ospf cots 10
 ip ospf dead-interval 4
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface to-r3
 ip ospf cost 10
 ip ospf dead-interval 4
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface to-r4
 ip ospf cost 10
 ip ospf dead-interval 4
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
interface to-r5
 ip ospf cost 10
 ip ospf dead-interval 4
 ip ospf hello-interval 1
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.255.0.2
 network 10.0.0.0/16 area 0
 network 10.255.0.0/24 area 0
exit
!
