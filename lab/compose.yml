# 가상 백본: FRR 라우터 6대 · 링크 9개 (링크마다 Docker 네트워크 하나)
#
#            r5 (DC)
#           /       \
#         r1 ------- r2        r1 ~ r4 = 백본 (이중 경로 + r2-r4 대각선)
#         |   ` . .  |         r5 = 데이터센터 에지 (192.168.50.0/24)
#         r4 ------- r3        r6 = 기업 고객 에지 (192.168.60.0/24)
#           \       /
#            r6 (고객)
#
# 링크 10.0.XY.0/29: 번호가 작은 라우터가 .2, 큰 쪽이 .3 (.1 은 Docker 게이트웨이)
# 인터페이스 이름 = 상대 라우터 (to-r2 …)

x-router: &router
  image: quay.io/frrouting/frr:10.2.1
  cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
  sysctls:
    net.ipv4.ip_forward: 1
    # 리눅스 기본(엄격 역경로 검사)은 가는 길 · 오는 길이 다르면 패킷을 버린다 — 백본 라우터처럼 끈다
    net.ipv4.conf.all.rp_filter: 0
    net.ipv4.conf.default.rp_filter: 0
  restart: unless-stopped

# r5 · r6 는 서비스 대역을 붙일 가상 인터페이스 svc 를 먼저 만든다 (lo 에 붙이면 /32 로만 광고됨)
x-edge: &edge
  <<: *router
  command: [sh, -c, 'ip link add svc type dummy 2>/dev/null; ip link set svc up; exec /usr/lib/frr/docker-start']

services:
  r1:
    <<: *router
    hostname: r1
    volumes: [./configs/daemons:/etc/frr/daemons:ro, ./runtime/r1:/etc/frr]
    networks:
      l12: { ipv4_address: 10.0.12.2, interface_name: to-r2 }
      l14: { ipv4_address: 10.0.14.2, interface_name: to-r4 }
      l15: { ipv4_address: 10.0.15.2, interface_name: to-r5 }
  r2:
    <<: *router
    hostname: r2
    volumes: [./configs/daemons:/etc/frr/daemons:ro, ./runtime/r2:/etc/frr]
    networks:
      l12: { ipv4_address: 10.0.12.3, interface_name: to-r1 }
      l23: { ipv4_address: 10.0.23.2, interface_name: to-r3 }
      l24: { ipv4_address: 10.0.24.2, interface_name: to-r4 }
      l25: { ipv4_address: 10.0.25.2, interface_name: to-r5 }
  r3:
    <<: *router
    hostname: r3
    volumes: [./configs/daemons:/etc/frr/daemons:ro, ./runtime/r3:/etc/frr]
    networks:
      l23: { ipv4_address: 10.0.23.3, interface_name: to-r2 }
      l34: { ipv4_address: 10.0.34.2, interface_name: to-r4 }
      l36: { ipv4_address: 10.0.36.2, interface_name: to-r6 }
  r4:
    <<: *router
    hostname: r4
    volumes: [./configs/daemons:/etc/frr/daemons:ro, ./runtime/r4:/etc/frr]
    networks:
      l14: { ipv4_address: 10.0.14.3, interface_name: to-r1 }
      l24: { ipv4_address: 10.0.24.3, interface_name: to-r2 }
      l34: { ipv4_address: 10.0.34.3, interface_name: to-r3 }
      l46: { ipv4_address: 10.0.46.2, interface_name: to-r6 }
  r5:
    <<: *edge
    hostname: r5
    volumes: [./configs/daemons:/etc/frr/daemons:ro, ./runtime/r5:/etc/frr]
    networks:
      l15: { ipv4_address: 10.0.15.3, interface_name: to-r1 }
      l25: { ipv4_address: 10.0.25.3, interface_name: to-r2 }
  r6:
    <<: *edge
    hostname: r6
    volumes: [./configs/daemons:/etc/frr/daemons:ro, ./runtime/r6:/etc/frr]
    networks:
      l36: { ipv4_address: 10.0.36.3, interface_name: to-r3 }
      l46: { ipv4_address: 10.0.46.3, interface_name: to-r4 }

networks:
  l12: { ipam: { config: [{ subnet: 10.0.12.0/29 }] } }
  l14: { ipam: { config: [{ subnet: 10.0.14.0/29 }] } }
  l15: { ipam: { config: [{ subnet: 10.0.15.0/29 }] } }
  l23: { ipam: { config: [{ subnet: 10.0.23.0/29 }] } }
  l24: { ipam: { config: [{ subnet: 10.0.24.0/29 }] } }
  l25: { ipam: { config: [{ subnet: 10.0.25.0/29 }] } }
  l34: { ipam: { config: [{ subnet: 10.0.34.0/29 }] } }
  l36: { ipam: { config: [{ subnet: 10.0.36.0/29 }] } }
  l46: { ipam: { config: [{ subnet: 10.0.46.0/29 }] } }
